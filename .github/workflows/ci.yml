name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        
      # https://github.com/marketplace/actions/astral-sh-setup-uv
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Compile project Python files
        run: >-
          uv run python -m compileall -q
          book_outputs.py book_sources.py epub_parser.py
          book-reader-builder.py book-to-sphinx.py
          pdf-reader-builder.py pdf-to-sphinx.py pdf-chapter-extractor.py
          tests
